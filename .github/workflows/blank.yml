name: Compilar Kernel Moto G30

on:
  workflow_dispatch:

jobs:
  build:
    
    steps:
      - name: Instalar dependências do sistema host
        runs-on: ubuntu-22.04
          sudo apt update
          sudo apt install -y build-essential lib32z1 lib32stdc++6 git curl bc bison flex libssl-dev python3 lld binutils-dev libelf-dev zip

      - name: Configurar Variáveis de Ambiente Globais
        run: |
          echo "my_top_dir=$HOME/moto_g30_kernel" >> $GITHUB_ENV

      - name: Baixar o código-fonte e as ferramentas (Prebuilts Oficiais)
        run: |
          mkdir -vp ${{ env.my_top_dir }}
          cd ${{ env.my_top_dir }}
          
          # 1. Clonar GCC 64-bit da Google
          mkdir -vp prebuilts/gcc/linux-x86/aarch64
          git clone https://googlesource.com --depth=1 prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          
          # 2. Clonar GCC 32-bit (arm-eabi-4.8 solicitado no manual)
          mkdir -vp prebuilts/gcc/linux-x86/arm
          git clone https://googlesource.com --depth=1 prebuilts/gcc/linux-x86/arm/arm-eabi-4.8

          # 3. Clonar Clang Host da Google
          mkdir -vp prebuilts/clang/host/linux-x86
          git clone https://googlesource.com --depth=1 prebuilts/clang/host/linux-x86

          # 4. Clonar GCC Host Toolchain (x86_64-linux-glibc2.17-4.8 solicitado no manual)
          mkdir -vp prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8
          git clone https://googlesource.com --depth=1 prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

          # 5. Baixar o código do kernel da Motorola (Renomeando para pasta kernel como pede o manual)
          git clone --depth=1 --branch MMI-RRCS31.Q1-3-56-2 https://github.com kernel

          # 6. Baixar a ferramenta AnyKernel3 para criar o ZIP instalável
          git clone https://github.com anykernel

      - name: Executar configuração e compilação do Kernel
        run: |
          cd ${{ env.my_top_dir }}
          
          # Definição exata das pastas do manual da Motorola
          kernel_out_dir="${{ env.my_top_dir }}/out/target/product/generic/obj/kernel/msm-4.19"
          mkdir -p "$kernel_out_dir"
          
          # Caminhos dos compiladores extraídos do manual
          aarch64_linux_android_="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          x86_64_linux_ar="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ar"
          x86_64_linux_ld="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ld"
          
          # A versão que baixa do repositório da Google pode ser ligeiramente mais nova (r383902b / r383912c)
          # Buscamos a pasta dinamicamente para evitar erro de "Folder not found"
          clang=$(find ${{ env.my_top_dir }}/prebuilts/clang/host/linux-x86/ -name "clang" | head -n 1)

          # 1. Unir arquivos de configuração defconfig
          cat kernel/msm-4.19/arch/arm64/configs/vendor/bengal-perf_defconfig \
              kernel/msm-4.19/arch/arm64/configs/vendor/ext_config/moto-bengal.config \
              kernel/msm-4.19/arch/arm64/configs/vendor/ext_config/caprip-default.config \
              kernel/msm-4.19/arch/arm64/configs/vendor/debugfs.config >> "$kernel_out_dir/.config"

          # Flags padrões extraídas do seu manual da Motorola
          FLAGS="DTC_EXT=dtc \
                 DTC_OVERLAY_TEST_EXT=ufdt_apply_overlay \
                 CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                 HOSTCC=$clang \
                 HOSTAR=$x86_64_linux_ar \
                 HOSTLD=$x86_64_linux_ld \
                 ARCH=arm64 \
                 CROSS_COMPILE=$aarch64_linux_android_ \
                 REAL_CC=$clang \
                 CLANG_TRIPLE=aarch64-linux-gnu-"

          # 2. Gerar defconfig final
          make -j$(nproc) -C kernel/msm-4.19 O="$kernel_out_dir" $FLAGS defconfig

          # 3. Instalar Headers
          make -j$(nproc) -C kernel/msm-4.19 O="$kernel_out_dir" $FLAGS \
               'HOSTCFLAGS=-I${{ env.my_top_dir }}/kernel/msm-4.19/include/uapi -I/usr/include -I/usr/include/x86_64-linux-gnu -L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld' \
               'HOSTLDFLAGS=-L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld' headers_install

          # 4. Compilar a imagem principal do Kernel
          make -j$(nproc) -C kernel/msm-4.19 O="$kernel_out_dir" $FLAGS \
               'HOSTCFLAGS=-I${{ env.my_top_dir }}/kernel/msm-4.19/include/uapi -I/usr/include -I/usr/include/x86_64-linux-gnu -L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld' \
               'HOSTLDFLAGS=-L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld'

          # 5. Instalar Módulos criados internamente
          make -j$(nproc) -C kernel/msm-4.19 O="$kernel_out_dir" $FLAGS \
               INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH="$kernel_out_dir/staging" modules_install

      - name: Compilar Driver de Wi-Fi (WLAN Driver Qualcomm)
        run: |
          cd ${{ env.my_top_dir }}
          kernel_out_dir="${{ env.my_top_dir }}/out/target/product/generic/obj/kernel/msm-4.19"
          aarch64_linux_android_="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          x86_64_linux_ar="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ar"
          x86_64_linux_ld="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ld"
          clang=$(find ${{ env.my_top_dir }}/prebuilts/clang/host/linux-x86/ -name "clang" | head -n 1)

          # Compilação exata do Bloco "WLAN Driver" do manual usando a árvore interna do driver qcacld-3.0
          make -j$(nproc) -C kernel/msm-4.19 O="$kernel_out_dir" M="${{ env.my_top_dir }}/kernel/msm-4.19/vendor/qcom/opensource/wlan/qcacld-3.0" \
               ARCH=arm64 CROSS_COMPILE=$aarch64_linux_android_ REAL_CC=$clang CLANG_TRIPLE=aarch64-linux-gnu- \
               HOSTCC=$clang HOSTAR=$x86_64_linux_ar HOSTLD=$x86_64_linux_ld \
               DTC_EXT=dtc DTC_OVERLAY_TEST_EXT=ufdt_apply_overlay CONFIG_BUILD_ARM64_DT_OVERLAY=y \
               CONFIG_INPUT_MISC_FPC1020_SAVE_TO_CLASS_DEVICE=y CONFIG_INPUT_FOCALTECH_0FLASH_MMI_IC_NAME=ft8719 \
               CONFIG_INPUT_HIMAX_PANEL_NOTIFICATIONS=y CONFIG_INPUT_HIMAX_V2_MMI_IC_NAME=hx83102 CONFIG_INPUT_HIMAX_V2_MMI_IC_NAME=hx83112 \
               CONFIG_INPUT_HIMAX_V2_MMI_IC_NAME_D=hx83102d CONFIG_INPUT_ILI_PANEL_NOTIFICATIONS=y CONFIG_ILITEK_RESUME_BY_DDI=y \
               CONFIG_ILITEK_FW_PANEL=y CONFIG_ILITEK_ESD=y CONFIG_INPUT_NOVA_PANEL_NOTIFICATIONS=y CONFIG_INPUT_NOVA_DRM_PANEL=y \
               CONFIG_INPUT_NOVA_CHIP_VER_1=y CONFIG_NOVA_ESD_ENABLE=y CONFIG_NOVA_LCM_FAST_LIGHTUP=y CONFIG_DRM_DYNAMIC_REFRESH_RATE=y \
               CONFIG_SX933X_USB_CAL=y CONFIG_SX933X_FLIP_CAL=y modules \
               WLAN_ROOT=vendor/qcom/opensource/wlan/qcacld-3.0/ WLAN_COMMON_ROOT=../qca-wifi-host-cmn \
               WLAN_COMMON_INC=vendor/qcom/opensource/wlan/qca-wifi-host-cmn WLAN_FW_API=vendor/qcom/opensource/wlan/fw-api \
               WLAN_PROFILE=default DYNAMIC_SINGLE_CHIP= MODNAME=wlan BOARD_PLATFORM=bengal CONFIG_QCA_CLD_WLAN=m ANDROID_BUILD_TOP=$PWD

      - name: Empacotar Kernel e Módulos (AnyKernel3 ZIP)
        run: |
          cd ${{ env.my_top_dir }}
          kernel_out_dir="${{ env.my_top_dir }}/out/target/product/generic/obj/kernel/msm-4.19"
          AK_DIR="${{ env.my_top_dir }}/anykernel"

          # Copiar imagem compilada para o AnyKernel (Moto G30 aceita Image.gz ou Image.gz-dtb)
          if [ -f "$kernel_out_dir/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$kernel_out_dir/arch/arm64/boot/Image.gz-dtb" "$AK_DIR/Image.gz-dtb"
          elif [ -f "$kernel_out_dir/arch/arm64/boot/Image.gz" ]; then
            cp "$kernel_out_dir/arch/arm64/boot/Image.gz" "$AK_DIR/Image.gz"
          fi

          # Buscar os módulos de áudio e o wlan.ko recém-criado para embutir no ZIP
          mkdir -p "$AK_DIR/modules"
          find "$kernel_out_dir" -name "*.ko" -exec cp {} "$AK_DIR/modules/" \;

          # Ajustes essenciais para injetar corretamente no aparelho caprip
          sed -i 's/device.name1=/device.name1=caprip/g' "$AK_DIR/anykernel.sh"
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot/block=auto/g' "$AK_DIR/anykernel.sh"

          # Compactar instalador TWRP
          cd "$AK_DIR"
          zip -r9 ${{ github.workspace }}/Kernel-MotoG30-Caprip-Oficial.zip * -x .git* README.md

      - name: Enviar o arquivo .ZIP para a interface do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Moto-G30-Download
          path: ${{ github.workspace }}/Kernel-MotoG30-Caprip-Oficial.zip
          
