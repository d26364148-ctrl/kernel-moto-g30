name: Ubuntu SSH with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04
    steps:
      # 1. Instala servidor SSH e Cloudflared
      - name: Install SSH and Cloudflared
        run: |
          sudo apt update
          sudo apt install -y openssh-server wget
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo apt install ./cloudflared-linux-amd64.deb

      # 2. Configura SSH (gera chave e habilita login)
      - name: Configure SSH
        run: |
          sudo systemctl enable ssh
          sudo systemctl start ssh
          # cria usuário temporário para acesso
          sudo useradd -m ubuntuuser
          echo "ubuntuuser:password123" | sudo chpasswd

      # 3. Cria túnel Cloudflare para expor porta 22
      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel create ubuntu-ssh
          cloudflared tunnel route dns ubuntu-ssh ubuntu-ssh.example.com
          cloudflared tunnel --url ssh://localhost:22 run ubuntu-ssh
