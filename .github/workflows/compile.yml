name: Ubuntu VM com SSH no Termux

on:
  workflow_dispatch:

jobs:
  start-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar OpenSSH na VM
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server cloudflared
          
          # Definir uma palavra-passe simples para o utilizador runner (ex: 123456)
          echo "runner:123456" | sudo chpasswd
          
          # Permitir autenticação por palavra-passe no SSH
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Iniciar Túnel SSH via Cloudflare
        run: |
          echo "=== INICIANDO TÚNEL CLOUDFLARE PARA SSH ==="
          # Expõe a porta 22 (SSH)
          cloudflared tunnel --url ssh://localhost:22 &
          sleep 5

      - name: Manter a VM Ativa
        run: |
          echo "VM pronta para ligação SSH!"
          sleep 21600
