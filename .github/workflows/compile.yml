name: Conectar no Ubuntu via Cloudflare SSH

on:
  workflow_dispatch:

jobs:
  ssh-cloudflare:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Launch Cloudflare Tunnel and SSH
        run: |
          # 1. Configurar senha padrão sem misturar comandos
          echo "runner:moto30" | sudo chpasswd
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          # 2. Ir para a pasta de 100GB livres
          cd ${{ github.workspace }}
          
          # 3. Baixar o binário puro estável direto do servidor de produção da Cloudflare
          curl -L https://equinox.io | tar -xz
          chmod +x cloudflared
          
          # 4. Iniciar o túnel direto no espaço gigante
          ./cloudflared tunnel --url tcp://localhost:22 > cloudflare.log 2>&1 &
          sleep 15
          
          echo "=== DADOS DE CONEXÃO ==="
          cat cloudflare.log | grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" || cat cloudflare.log
          echo "========================"
          sleep 21600
