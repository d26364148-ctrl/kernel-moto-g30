name: Compilar Kernel Moto G30

on:
  workflow_dispatch: # Ativa o botão manual obrigatoriamente

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: 1. Limpar e atualizar o Ubuntu
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32z1 lib32stdc++6 git curl bc bison flex libssl-dev python3 lld binutils-dev libelf-dev zip

      - name: 2. Configurar Variáveis de Ambiente Globais
        run: |
          echo "my_top_dir=$HOME/moto_g30_kernel" >> $GITHUB_ENV

      - name: 3. Criar Pastas e Baixar Compiladores (Links Oficiais Corrigidos)
        run: |
          mkdir -vp ${{ env.my_top_dir }}
          cd ${{ env.my_top_dir }}
          
          # A. Clonar GCC 64-bit da Google (Link corrigido e completo)
          mkdir -vp prebuilts/gcc/linux-x86/aarch64
          git clone https://googlesource.com --depth=1 prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          
          # B. Clonar GCC 32-bit da Google (Link corrigido e completo)
          mkdir -vp prebuilts/gcc/linux-x86/arm
          git clone https://googlesource.com --depth=1 prebuilts/gcc/linux-x86/arm/arm-eabi-4.8

          # C. Clonar Clang Host da Google (Link corrigido e completo)
          mkdir -vp prebuilts/clang/host/linux-x86
          git clone https://googlesource.com --depth=1 prebuilts/clang/host/linux-x86

          # D. Clonar GCC Host Toolchain da Google (Link corrigido e completo)
          mkdir -vp prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8
          git clone https://googlesource.com --depth=1 prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

          # E. Baixar o código oficial do Kernel da Motorola (Link corrigido e completo)
          git clone --depth=1 --branch MMI-RRCS31.Q1-3-56-2 https://github.com kernel

          # F. Baixar a ferramenta AnyKernel3 (Link corrigido e completo)
          git clone https://github.com anykernel

      - name: 4. Unir Configurações (Defconfig) e Compilar o Kernel
        run: |
          cd ${{ env.my_top_dir }}
          
          # Ajuste de pastas de saída
          kernel_out_dir="${{ env.my_top_dir }}/out/target/product/generic/obj/kernel/msm-4.19"
          mkdir -p "$kernel_out_dir"
          
          aarch64_linux_android_="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          x86_64_linux_ar="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ar"
          x86_64_linux_ld="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ld"
          
          # Localiza o clang de forma dinâmica para evitar erros de nomes
          clang=$(find ${{ env.my_top_dir }}/prebuilts/clang/host/linux-x86/ -name "clang" | head -n 1)

          # Montagem correta dos arquivos defconfig da Motorola
          cat kernel/arch/arm64/configs/vendor/bengal-perf_defconfig \
              kernel/arch/arm64/configs/vendor/ext_config/moto-bengal.config \
              kernel/arch/arm64/configs/vendor/ext_config/caprip-default.config \
              kernel/arch/arm64/configs/vendor/debugfs.config >> "$kernel_out_dir/.config"

          # Parâmetros oficiais Qualcomm LLVM/Clang
          FLAGS="DTC_EXT=dtc \
                 DTC_OVERLAY_TEST_EXT=ufdt_apply_overlay \
                 CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                 HOSTCC=$clang \
                 HOSTAR=$x86_64_linux_ar \
                 HOSTLD=$x86_64_linux_ld \
                 ARCH=arm64 \
                 CROSS_COMPILE=$aarch64_linux_android_ \
                 REAL_CC=$clang \
                 CLANG_TRIPLE=aarch64-linux-gnu-"

          # Preparar a estrutura de compilação
          make -j$(nproc) -C kernel O="$kernel_out_dir" $FLAGS defconfig

          # Rodar o build principal do Kernel
          make -j$(nproc) -C kernel O="$kernel_out_dir" $FLAGS \
               'HOSTCFLAGS=-I${{ env.my_top_dir }}/kernel/include/uapi -I/usr/include'

      - name: 5. Compilar Módulo de Wi-Fi (WLAN Driver Qualcomm)
        run: |
          cd ${{ env.my_top_dir }}
          kernel_out_dir="${{ env.my_top_dir }}/out/target/product/generic/obj/kernel/msm-4.19"
          aarch64_linux_android_="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          x86_64_linux_ar="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ar"
          x86_64_linux_ld="${{ env.my_top_dir }}/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ld"
          clang=$(find ${{ env.my_top_dir }}/prebuilts/clang/host/linux-x86/ -name "clang" | head -n 1)

          # Compilação direcionada do driver qcacld-3.0
          make -j$(nproc) -C kernel O="$kernel_out_dir" M="${{ env.my_top_dir }}/kernel/vendor/qcom/opensource/wlan/qcacld-3.0" \
               ARCH=arm64 CROSS_COMPILE=$aarch64_linux_android_ REAL_CC=$clang CLANG_TRIPLE=aarch64-linux-gnu- \
               HOSTCC=$clang HOSTAR=$x86_64_linux_ar HOSTLD=$x86_64_linux_ld \
               modules WLAN_ROOT=vendor/qcom/opensource/wlan/qcacld-3.0/ WLAN_COMMON_ROOT=../qca-wifi-host-cmn \
               WLAN_COMMON_INC=vendor/qcom/opensource/wlan/qca-wifi-host-cmn WLAN_FW_API=vendor/qcom/opensource/wlan/fw-api \
               WLAN_PROFILE=default BOARD_PLATFORM=bengal CONFIG_QCA_CLD_WLAN=m

      - name: 6. Empacotar Kernel e Drivers em arquivo ZIP Instalável
        run: |
          cd ${{ env.my_top_dir }}
          kernel_out_dir="${{ env.my_top_dir }}/out/target/product/generic/obj/kernel/msm-4.19"
          AK_DIR="${{ env.my_top_dir }}/anykernel"

          # Copia a imagem final gerada
          cp "$kernel_out_dir/arch/arm64/boot/Image.gz-dtb" "$AK_DIR/Image.gz-dtb" || cp "$kernel_out_dir/arch/arm64/boot/Image.gz" "$AK_DIR/Image.gz"

          # Injeta os módulos externos compilados (.ko) para dentro do zip
          mkdir -p "$AK_DIR/modules"
          find "$kernel_out_dir" -name "*.ko" -exec cp {} "$AK_DIR/modules/" \;

          # Configura AnyKernel para reconhecer o codinome 'caprip' do Moto G30
          sed -i 's/device.name1=/device.name1=caprip/g' "$AK_DIR/anykernel.sh"
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot/block=auto/g' "$AK_DIR/anykernel.sh"

          cd "$AK_DIR"
          zip -r9 ${{ github.workspace }}/Kernel-MotoG30-Completo.zip * -x .git* README.md

      - name: 7. Enviar o arquivo .ZIP para Download
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG30-Pronto
          path: ${{ github.workspace }}/Kernel-MotoG30-Completo.zi
