name: Compilar Kernel Moto G30 (via tmate)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Instalar ferramentas do Android e dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git ccache zip unzip clang lld llvm

    - name: Iniciar Conexao SSH Segura (Sem Login)
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: false # Permite que você conecte direto do seu terminal sem precisar cadastrar chaves SSH
        
