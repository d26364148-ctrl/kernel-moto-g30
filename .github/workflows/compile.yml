name: Cross-Compile Clang for ARM64

on:
  workflow_dispatch: # Permite iniciar a compilação manualmente pelo celular

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar ferramentas essenciais
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clonar código fonte do LLVM/Clang (Exemplo LLVM 18/19)
        run: |
          git clone --depth 1 https://github.com/llvm/llvm-project.git

      - name: Configurar CMake para Compilação Cruzada ARM64
        run: |
          mkdir build && cd build
          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DLLVM_TARGET_ARCH=AArch64 \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF

      - name: Executar a Compilação (Ninja)
        run: |
          cd build
          ninja clang

      - name: Compactar o Binário Gerado
        run: |
          mkdir -p output/bin
          cp build/bin/clang output/bin/
          tar -czvf clang-arm64-android.tar.gz -C output .

      - name: Enviar Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: clang-arm64-binario
          path: clang-arm64-android.tar.gz
