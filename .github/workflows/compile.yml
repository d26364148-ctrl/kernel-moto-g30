name: Ubuntu VM com Cloudflare Tunnel

on:
  workflow_dispatch: # Permite iniciar manualmente pela aba Actions

jobs:
  start-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar acesso SSH / Terminal local
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd tmux # Instala terminal web e gerenciador de sessão

      - name: Instalar Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Iniciar Túnel Cloudflare e Expor Serviço
        run: |
          # Exemplo abrindo um terminal web interativo (ttyd) na porta 7681
          nohup ttyd -p 7681 bash > /dev/null 2>&1 &
          
          echo "=== INICIANDO TÚNEL CLOUDFLARE ==="
          # Cria um túnel rápido e exibe a URL pública nos logs do GitHub Actions
          cloudflared tunnel --url http://localhost:7681 &
          sleep 5

      - name: Manter a VM Ativa
        run: |
          echo "A VM está rodando! Acesse o link gerado pelo Cloudflare no log acima."
          echo "Para encerrar a VM, cancele a execução do Workflow no GitHub."
          # Mantém o Job rodando (limite máximo de 6 horas do GitHub Actions)
          sleep 21600
