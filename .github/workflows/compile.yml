name: Conectar no Ubuntu via Cloudflare SSH

on:
  workflow_dispatch:

jobs:
  ssh-cloudflare:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo5 libncurses5 lld llvm

      - name: Configure SSH Server and Cloudflare Tunnel
        run: |
          echo "runner:moto30" | sudo chpasswd
          
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          sudo mkdir -p /mnt/runner_home
          sudo chown -R runner:runner /mnt/runner_home
          sudo usermod -d /mnt/runner_home runner
          
          wget -q https://github.com
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          echo "=== DADOS DE CONEXÃO DO CLOUDFLARE TUNNEL ==="
          cloudflared tunnel --url tcp://localhost:22 > /mnt/runner_home/cloudflare.log 2>&1 &
          
          sleep 12
          
          cat /mnt/runner_home/cloudflare.log | grep -oE "tcp://[a-zA-Z0-9.-]+\.trycloudflare\.com:[0-9]+" || cat /mnt/runner_home/cloudflare.log | grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" || true
          echo "============================================="
          
          sleep 21600
