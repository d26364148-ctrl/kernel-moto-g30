name: SSH via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04
    steps:
      - name: Configurar Servidor SSH na VM
        run: |
          # Define uma senha temporária para o usuário runner (ex: senha123)
          echo "runner:senha123" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config || echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Instalar Cloudflare Tunnel
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Iniciar Túnel TCP e Exibir Dados de Conexão
        run: |
          echo "===================================================="
          echo " INICIANDO TÚNEL CLOUDFLARE PARA SSH"
          echo "===================================================="
          
          # Inicia o túnel TCP apontando para a porta 22 do SSH local
          cloudflared tunnel --url tcp://localhost:22 > tunnel.log 2>&1 &
          
          # Aguarda o túnel conectar e gerar o link
          sleep 6
          cat tunnel.log
          
          echo "===================================================="
          echo " O runner ficará ativo por 6 horas."
          echo "===================================================="
          
          # Mantém a VM viva
          sleep 21600
