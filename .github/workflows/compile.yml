name: Android VM with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare.list
          sudo apt update
          sudo apt install -y cloudflared

      - name: Verify Cloudflared
        run: cloudflared --version

      - name: Create Tunnel
        run: cloudflared tunnel create android-vm

      - name: Configure DNS
        run: cloudflared tunnel route dns android-vm androidvm.example.com

      - name: Run Tunnel
        run: cloudflared tunnel run android-vm
