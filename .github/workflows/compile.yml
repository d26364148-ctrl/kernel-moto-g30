name: Compilar Kernel Moto G30

on:
  workflow_dispatch: # Cria o botão para iniciar manualmente

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils git bison flex libelf-dev clang lld

    - name: Clonar Este Repositório
      uses: actions/checkout@v4

    - name: Configurar Pastas e Baixar Toolchains (GCC e Clang)
      run: |
        mkdir -p $GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64
        mkdir -p $GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/arm
        mkdir -p $GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86
        mkdir -p $GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

        # URLs corrigidas do Android GoogleSource (Clonagem rasa --depth=1)
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
        git clone --depth=1 https://googlesource.com $GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86
        git clone --depth=1 https://googlesource.com $GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

    - name: Organizar Pastas do Kernel
      run: |
        # Transfere a pasta do seu repositório para o local que o Makefile da Motorola exige
        mkdir -p $GITHUB_WORKSPACE/kernel
        mv "$GITHUB_WORKSPACE/Kernel Moto G30" $GITHUB_WORKSPACE/kernel/msm-4.19

    - name: Compilar o Kernel
      run: |
        export my_top_dir=$GITHUB_WORKSPACE
        
        mkdir -p $my_top_dir/out/target/product/generic/obj/kernel/msm-4.19 
        kernel_out_dir=$my_top_dir/out/target/product/generic/obj/kernel/msm-4.19 
        kernel_obj_out_dir=$my_top_dir/out/target/product/generic/obj/KERNEL_OBJ 
        
        make_cmd=make
        aarch64_linux_android_=$my_top_dir/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        x86_64_linux_ar=$my_top_dir/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ar
        x86_64_linux_ld=$my_top_dir/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ld
        clang=$my_top_dir/prebuilts/clang/host/linux-x86/clang-r383902b/bin/clang

        cd $my_top_dir
        
        # Consolida as diretivas de configuração da Motorola
        cat kernel/msm-4.19/arch/arm64/configs/vendor/bengal-perf_defconfig \
            kernel/msm-4.19/arch/arm64/configs/vendor/ext_config/moto-bengal.config \
            kernel/msm-4.19/arch/arm64/configs/vendor/ext_config/caprip-default.config \
            kernel/msm-4.19/arch/arm64/configs/vendor/debugfs.config >> $kernel_out_dir/.config 

        # Defoldconfig
        make -C kernel/msm-4.19 O=$kernel_out_dir DTC_EXT=dtc DTC_OVERLAY_TEST_EXT=ufdt_apply_overlay CONFIG_BUILD_ARM64_DT_OVERLAY=y HOSTCC=$clang HOSTAR=$x86_64_linux_ar HOSTLD=$x86_64_linux_ld ARCH=arm64 CROSS_COMPILE=$aarch64_linux_android_ REAL_CC=$clang CLANG_TRIPLE=aarch64-linux-gnu- defoldconfig

        # Instalação dos Headers estruturais
        $make_cmd -j$(nproc) -C kernel/msm-4.19 'HOSTCFLAGS=-I$my_top_dir/kernel/msm-4.19/include/uapi -I/usr/include -I/usr/include/x86_64-linux-gnu -L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld' 'HOSTLDFLAGS=-L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld' ARCH=arm64 CROSS_COMPILE=$aarch64_linux_android_ O=$kernel_out_dir REAL_CC=$clang CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT=dtc DTC_OVERLAY_TEST_EXT=ufdt_apply_overlay CONFIG_BUILD_ARM64_DT_OVERLAY=y HOSTCC=$clang HOSTAR=$x86_64_linux_ar HOSTLD=$x86_64_linux_ld headers_install

        # Processo de compilação adaptado para os núcleos virtuais do GitHub Actions
        $make_cmd -j$(nproc) -C kernel/msm-4.19 ARCH=arm64 CROSS_COMPILE=$aarch64_linux_android_ 'HOSTCFLAGS=-I$my_top_dir/kernel/msm-4.19/include/uapi -I/usr/include -I/usr/include/x86_64-linux-gnu -L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld' 'HOSTLDFLAGS=-L/usr/lib -L/usr/lib/x86_64-linux-gnu -fuse-ld=lld' O=$kernel_out_dir REAL_CC=$clang CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT=dtc DTC_OVERLAY_TEST_EXT=ufdt_apply_overlay CONFIG_BUILD_ARM64_DT_OVERLAY=y HOSTCC=$clang HOSTAR=$x86_64_linux_ar HOSTLD=$x86_64_linux_ld

    - name: Disponibilizar arquivo compilado para Download
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-MotoG30-Compilado
        path: ${{ github.workspace }}/out/target/product/generic/obj/kernel/msm-4.19/arch/arm64/boot/Image.gz-dtb
        
