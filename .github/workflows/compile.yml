name: Compilar Kernel Moto G30 (via Serveo)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Instalar ferramentas do Android e dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git ccache zip unzip clang lld llvm

    - name: Configurar senha do terminal
      run: |
        echo "runneradmin:MotoG30Kernel" | sudo chpasswd
        sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
        sudo systemctl restart ssh

    - name: Iniciar Tunel SSH via Serveo (Sem Login)
      run: |
        echo "=========================================================="
        echo "AGUARDE ALGUNS SEGUNDOS ATÉ O SERVEO GERAR O SEU LINK..."
        echo "=========================================================="
        
        # Cria o túnel reverso usando o Serveo e mostra os dados na tela
        ssh -o StrictHostKeyChecking=no -R 22:localhost:22 serveo.net 2>&1 | grep -i "Forwarding" || true
        
        # Mantém a máquina ligada por 6 horas para você trabalhar
        sleep 21600
        
