name: Teste Inicial Moto G30

on:
  workflow_dispatch: # Ativa o botão manual obrigatoriamente

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: 1. Limpar e atualizar o Ubuntu
        run: |
          sudo apt update
          sudo apt install -y git build-essential zip

      - name: 2. Testar criação de pastas e Git
        run: |
          echo "my_top_dir=$HOME/moto_g30_kernel" >> $GITHUB_ENV
          mkdir -vp $HOME/moto_g30_kernel
          cd $HOME/moto_g30_kernel
          
          echo "=== AMBIENTE PRONTO E FUNCIONANDO ==="
          git --version
          
