name: Ubuntu VM com SSH no Termux

on:
  workflow_dispatch:

jobs:
  start-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar OpenSSH na VM
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server curl
          
          # Definir a palavra-passe do utilizador runner como '123456'
          echo "runner:123456" | sudo chpasswd
          
          # Permitir autenticação por palavra-passe no SSH
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Instalar Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Iniciar Túnel SSH via Cloudflare
        run: |
          echo "=== INICIANDO TÚNEL CLOUDFLARE PARA SSH ==="
          cloudflared tunnel --url ssh://localhost:22 &
          sleep 5

      - name: Manter a VM Ativa
        run: |
          echo "VM pronta para ligação SSH!"
          sleep 21600
