name: Android VM with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  android-vm:
    runs-on: self-hosted   # precisa ser um runner com KVM habilitado
    steps:
      # 1. Instala QEMU/KVM e Cloudflared
      - name: Install QEMU and Cloudflared
        run: |
          sudo apt update
          sudo apt install -y qemu-kvm libvirt-daemon-system virt-manager wget
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo apt install ./cloudflared-linux-amd64.deb

      # 2. Baixa ISO do Android x86 4.0
      - name: Download Android ISO
        run: |
          curl -L -o android-x86.iso https://osdn.net/projects/android-x86/downloads/62310/android-x86-4.0-r1.iso

      # 3. Inicia VM com VNC habilitado
      - name: Start Android VM
        run: |
          qemu-system-x86_64 \
            -enable-kvm \
            -m 2048 \
            -cdrom android-x86.iso \
            -boot d \
            -net nic -net user \
            -vnc :1 &

      # 4. Cria túnel Cloudflare para expor VNC (porta 5901)
      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel create android-vm
          cloudflared tunnel route dns android-vm androidvm.example.com
          cloudflared tunnel --url vnc://localhost:5901 run android-vm
